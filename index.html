<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050608">
<title>القناص صفر — إصدار الميليمات</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { height:100%; overflow:hidden; background:#050608; font-family:'Tahoma','Segoe UI',sans-serif; color:#c8d0d8; direction:rtl; }
  #game { display:block; width:100%; height:100%; touch-action:none; }
  .hud { position:fixed; inset:0; pointer-events:none; z-index:5; }
  .hud-top { position:absolute; top:8px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:flex-start; font-size:10px; text-shadow:0 0 4px #000; }
  .hud-block { line-height:1.4; }
  .hud-label { color:#5a6570; font-size:9px; }
  .hud-value { color:#d4dde6; font-size:13px; font-weight:bold; }
  .hud-bottom { position:absolute; bottom:8px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:flex-end; }
  .breath-wrap { width:110px; }
  .breath-bar { height:6px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; }
  .breath-fill { height:100%; background:linear-gradient(90deg,#4a9eff,#a8d4ff); transition:width 0.08s; }
  .ammo { display:flex; gap:3px; }
  .bullet-icon { width:5px; height:16px; border-radius:2px; background:#c8b878; }
  .bullet-icon.empty { background:#2a2e33; }
  .fire-btn { position:fixed; right:20px; bottom:70px; width:64px; height:64px; border-radius:50%; background:radial-gradient(circle at 30% 30%,#8b2a2a,#5a1010); border:3px solid #a84040; color:#ffe0e0; font-size:12px; font-weight:bold; pointer-events:auto; display:flex; align-items:center; justify-content:center; z-index:6; }
  .fire-btn:active { transform:scale(0.93); }
  .breath-btn { position:fixed; left:20px; bottom:70px; width:64px; height:64px; border-radius:50%; background:radial-gradient(circle at 30% 30%,#2a3a5a,#101a2a); border:3px solid #3a5078; color:#c0d8ff; font-size:12px; font-weight:bold; pointer-events:auto; display:flex; align-items:center; justify-content:center; z-index:6; }
  .breath-btn.active { background:#4a8aff; border-color:#6aaaff; }
  .zoom-btn { position:fixed; right:20px; bottom:150px; width:48px; height:48px; border-radius:50%; background:rgba(20,30,40,0.85); border:2px solid #3a4a5a; color:#9ab0c0; font-size:11px; font-weight:bold; pointer-events:auto; display:flex; align-items:center; justify-content:center; z-index:6; }
  .scope-panel { position:fixed; left:10px; top:110px; background:rgba(8,12,18,0.88); border:1px solid #2a3a4a; border-radius:6px; padding:8px; pointer-events:auto; z-index:7; }
  .scope-row { display:flex; gap:4px; align-items:center; margin-bottom:4px; }
  .scope-btn { flex:1; padding:9px 0; min-width:36px; background:rgba(30,40,55,0.9); border:1px solid #4a6a8a; color:#c0d8ff; border-radius:3px; font-size:11px; font-weight:bold; cursor:pointer; }
  .scope-btn:active { background:#4a6a8a; }
  .scope-btn.reset { background:rgba(60,30,30,0.9); color:#ffb0b0; }
  .scope-readout { text-align:center; font-size:10px; color:#a8d4ff; background:rgba(0,0,0,0.5); padding:5px; border-radius:3px; }
  .scope-readout .e { color:#ffb060; }
  .scope-readout .w { color:#60c0ff; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px; background:radial-gradient(circle,rgba(8,10,14,0.97),rgba(2,3,5,0.99)); text-align:center; padding:24px; z-index:20; overflow-y:auto; }
  .overlay.hidden { display:none; }
  .overlay h1 { font-size:1.8rem; color:#d4dde6; font-weight:bold; }
  .briefing { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:6px; padding:12px 18px; text-align:right; font-size:11px; line-height:2; width:100%; max-width:350px; }
  .key { color:#6aaaff; font-weight:bold; }
  .warn { color:#ffb060; }
  .btn { padding:14px 40px; font-size:14px; border:none; border-radius:4px; background:linear-gradient(135deg,#3a5a8a,#2a3a5a); color:#d4dde6; font-weight:bold; cursor:pointer; }
  .result-stats { display:flex; gap:20px; }
  .result-cell .v { font-size:1.6rem; font-weight:bold; color:#a8d4ff; }
  .result-cell .l { font-size:10px; color:#5a6570; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="hud-top">
    <div class="hud-block"><div class="hud-label">الهدف</div><div class="hud-value" id="targetNum">1 / 5</div><div class="hud-label">المسافة</div><div class="hud-value"><span id="distance">0</span> م</div></div>
    <div class="hud-block" style="text-align:center"><div class="hud-label">الرياح</div><div class="hud-value"><span id="windArrow">→</span> <span id="windSpeed">0</span> م/ث</div><div class="hud-label">الوقت</div><div class="hud-value" id="timeLeft">120</div><div class="hud-label">الطقس</div><div class="hud-value" id="weatherLabel">صافٍ</div></div>
    <div class="hud-block" style="text-align:left"><div class="hud-label">النقاط</div><div class="hud-value" id="scoreVal">0</div><div class="hud-label">الإصابات</div><div class="hud-value" id="hitsVal">0 / 0</div></div>
  </div>
  <div class="hud-bottom">
    <div class="breath-wrap"><div class="hud-label">النفس</div><div class="breath-bar"><div class="breath-fill" id="breathBar" style="width:100%"></div></div></div>
    <div class="ammo" id="ammoBar"></div>
  </div>
</div>
<div class="scope-panel" id="scopePanel">
  <div class="scope-row"><button class="scope-btn" id="elevDown">▼</button><button class="scope-btn reset" id="elevReset">ارتفاع</button><button class="scope-btn" id="elevUp">▲</button></div>
  <div class="scope-readout"><div>الارتفاع <span class="e">0.0</span> MIL</div><div>الانحراف <span class="w">0.0</span> MIL</div></div>
  <div class="scope-row" style="margin-top:5px"><button class="scope-btn" id="windLeft">◀</button><button class="scope-btn reset" id="windReset">انحراف</button><button class="scope-btn" id="windRight">▶</button></div>
</div>
<button class="breath-btn" id="breathBtn">نفس</button>
<button class="fire-btn" id="fireBtn">إطلاق</button>
<button class="zoom-btn" id="zoomBtn">1x</button>

<div class="overlay" id="startScreen">
  <h1>القناص صفر</h1>
  <div class="briefing">
    <div>◈ <span class="key">اسحب</span> لتحريك التصويب</div>
    <div>◈ <span class="key">إطلاق</span> لفتح النار</div>
    <div>◈ <span class="key">نفس</span> لحبس النفس</div>
    <div>◈ <span class="warn">⚠ باليستيك حقيقي:</span> استخدم ▲▼ و ◀▶ للتعويض</div>
  </div>
  <button class="btn" id="startBtn">ابدأ المهمة</button>
</div>
<div class="overlay hidden" id="endScreen">
  <h1 id="endTitle">المهمة انتهت</h1>
  <div class="result-stats">
    <div class="result-cell"><div class="v" id="endScore">0</div><div class="l">النقاط</div></div>
    <div class="result-cell"><div class="v" id="endHits">0</div><div class="l">الإصابات</div></div>
    <div class="result-cell"><div class="v" id="endAcc">0%</div><div class="l">الدقة</div></div>
  </div>
  <button class="btn" id="retryBtn">مهمة جديدة</button>
</div>
<script>
(() => {
'use strict';
function toArabicNum(num) { const a = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩']; return String(num).replace(/[0-9]/g, d => a[+d]); }
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1;
function resize() { dpr = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight; canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
window.addEventListener('resize', resize); resize();

const Sound = {
  ctx: null, masterGain: null, windNode: null, windGain: null, windFilter: null, rainNode: null, rainGain: null, initialized: false,
  init() { if (this.initialized) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.masterGain = this.ctx.createGain(); this.masterGain.gain.value = 0.8; this.masterGain.connect(this.ctx.destination); this.initialized = true; this.startWind(); this.startRain(); } catch(e) { this.ctx = null; } },
  startWind() { if (!this.ctx) return; const b = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate); const d = b.getChannelData(0); let l = 0; for (let i = 0; i < b.length; i++) { const w = Math.random() * 2 - 1; l = (l + 0.02 * w) / 1.02; d[i] = l * 3.5; } this.windNode = this.ctx.createBufferSource(); this.windNode.buffer = b; this.windNode.loop = true; this.windFilter = this.ctx.createBiquadFilter(); this.windFilter.type = 'bandpass'; this.windFilter.frequency.value = 400; this.windGain = this.ctx.createGain(); this.windGain.gain.value = 0.05; this.windNode.connect(this.windFilter).connect(this.windGain).connect(this.masterGain); this.windNode.start(); },
  updateWind(s) { if (!this.windGain) return; this.windGain.gain.linearRampToValueAtTime(Math.min(0.18, 0.02 + s * 0.018), this.ctx.currentTime + 0.5); this.windFilter.frequency.linearRampToValueAtTime(300 + s * 60, this.ctx.currentTime + 0.5); },
  startRain() { if (!this.ctx) return; const b = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < b.length; i++) d[i] = (Math.random() * 2 - 1) * 0.5; this.rainNode = this.ctx.createBufferSource(); this.rainNode.buffer = b; this.rainNode.loop = true; const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 800; this.rainGain = this.ctx.createGain(); this.rainGain.gain.value = 0; this.rainNode.connect(f).connect(this.rainGain).connect(this.masterGain); this.rainNode.start(); },
  updateRain(i) { if (this.rainGain) this.rainGain.gain.linearRampToValueAtTime(i * 0.15, this.ctx.currentTime + 0.5); },
  shot() { if (!this.ctx) return; const t = this.ctx.currentTime; const b = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.6, this.ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < b.length; i++) { const e = Math.pow(1 - i / b.length, 5); d[i] = ((Math.random() * 2 - 1) * 0.7 + Math.sin(i * 0.0015) * Math.exp(-i / 4000) * 0.5) * e; } const s = this.ctx.createBufferSource(); s.buffer = b; const g = this.ctx.createGain(); g.gain.value = 0.9; const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(3000, t); f.frequency.exponentialRampToValueAtTime(400, t + 0.4); s.connect(f).connect(g).connect(this.masterGain); s.start(t); },
  hit() { if (!this.ctx) return; const o = this.ctx.createOscillator(); const g = this.ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(320, this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.12); g.gain.setValueAtTime(0.25, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18); o.connect(g).connect(this.masterGain); o.start(); o.stop(this.ctx.currentTime + 0.18); },
  headshot() { if (!this.ctx) return; [880, 1100, 1320].forEach((freq, i) => { const o = this.ctx.createOscillator(); const g = this.ctx.createGain(); o.frequency.value = freq; g.gain.setValueAtTime(0.15, this.ctx.currentTime + i*0.05); g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i*0.05 + 0.25); o.connect(g).connect(this.masterGain); o.start(this.ctx.currentTime + i*0.05); o.stop(this.ctx.currentTime + i*0.05 + 0.25); }); },
  click() { if (!this.ctx) return; const o = this.ctx.createOscillator(); const g = this.ctx.createGain(); o.type = 'square'; o.frequency.setValueAtTime(1600, this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.03); g.gain.setValueAtTime(0.1, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04); o.connect(g).connect(this.masterGain); o.start(); o.stop(this.ctx.currentTime + 0.04); },
  thunder() { if (!this.ctx) return; const t = this.ctx.currentTime; const b = this.ctx.createBuffer(1, this.ctx.sampleRate * 1.5, this.ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < b.length; i++) { const e = Math.pow(1 - i / b.length, 2) * (0.5 + Math.random() * 0.5); d[i] = (Math.random() * 2 - 1) * e; } const s = this.ctx.createBufferSource(); s.buffer = b; const g = this.ctx.createGain(); g.gain.value = 0.4; const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 200; s.connect(f).connect(g).connect(this.masterGain); s.start(t); }
};

const SCALE = 0.15, GRAVITY = 9.81 / SCALE, DRAG = 0.000018, BULLET_SPEED = 850 / SCALE, WIND_FORCE = 0.35;
const G = { running: false, time: 0, timeLimit: 120000, score: 0, totalShots: 0, hits: 0, currentTarget: 0, totalTargets: 5, ammo: 5, maxAmmo: 5, reloading: false, aim: { x: 0, y: 0 }, zoom: 1, zoomTarget: 1, recoil: 0, swayX: 0, swayY: 0, scope: { elevClicks: 0, windClicks: 0, clickValue: 0.1 }, breath: 100, holdingBreath: false, wind: { speed: 3, dir: 1, gust: 0 }, camera: { x: 0, y: 0 }, bullets: [], targets: [], obstacles: [], particles: [], impacts: [], shake: 0, flash: 0, touch: { active: false, id: null, sx: 0, sy: 0, ax: 0, ay: 0 }, weather: { type: 'clear', intensity: 0, transition: 0, nextChange: 30000, timer: 0, rainDrops: [], sandParticles: [], lightning: 0, thunderTimer: 0, wetness: 0 }, screenBlood: 0, damageFlash: 0 };
const WORLD_W = 3000, WORLD_H = 1600, PLAYER_Y_OFFSET = 100;

function initWeather() { G.weather.type = 'clear'; G.weather.transition = 0; G.weather.rainDrops = []; G.weather.sandParticles = []; for (let i = 0; i < 200; i++) G.weather.rainDrops.push({ x: Math.random() * W, y: Math.random() * H, speed: 15 + Math.random() * 10, length: 8 + Math.random() * 8 }); for (let i = 0; i < 150; i++) G.weather.sandParticles.push({ x: Math.random() * W, y: Math.random() * H, speed: 3 + Math.random() * 6, size: 1 + Math.random() * 2 }); }
function updateWeather(dt) { G.weather.timer += dt; if (G.weather.timer > G.weather.nextChange) { G.weather.timer = 0; const types = ['clear', 'rain', 'sandstorm', 'storm']; G.weather.type = types[Math.floor(Math.random() * types.length)]; G.weather.nextChange = 25000 + Math.random() * 35000; } G.weather.transition = Math.min(1, G.weather.transition + dt * 0.0003); G.weather.intensity = (G.weather.type === 'clear' ? 0 : G.weather.type === 'rain' ? 0.6 : 0.8) * G.weather.transition; if (G.weather.type === 'rain' || G.weather.type === 'storm') { for (const d of G.weather.rainDrops) { d.y += d.speed * dt * 0.06; d.x += G.wind.dir * G.wind.speed * 0.05 * dt * 0.06; if (d.y > H) { d.y = -d.length; d.x = Math.random() * W; } } G.weather.wetness = Math.min(1, G.weather.wetness + dt * 0.00005); } else G.weather.wetness = Math.max(0, G.weather.wetness - dt * 0.00003); if (G.weather.type === 'storm') { G.weather.thunderTimer -= dt; if (G.weather.thunderTimer <= 0) { G.weather.thunderTimer = 5000; G.weather.lightning = 1; setTimeout(() => { if (G.weather.type === 'storm') Sound.thunder(); }, 500); } } if (G.weather.lightning > 0) G.weather.lightning = Math.max(0, G.weather.lightning - dt * 0.008); }
function drawWeatherEffects() { if ((G.weather.type === 'rain' || G.weather.type === 'storm') && G.weather.intensity > 0.05) { ctx.strokeStyle = `rgba(160,180,220,${0.5 * G.weather.intensity})`; ctx.beginPath(); for (const d of G.weather.rainDrops) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - G.wind.dir * 2, d.y + d.length); } ctx.stroke(); } if (G.weather.type === 'sandstorm') { ctx.fillStyle = `rgba(180,140,90,${G.weather.intensity * 0.35})`; ctx.fillRect(0, 0, W, H); } if (G.weather.lightning > 0.05) { ctx.fillStyle = `rgba(200,220,255,${G.weather.lightning * 0.5})`; ctx.fillRect(0, 0, W, H); } }
function addScreenBlood(amount) { G.screenBlood = Math.min(1, G.screenBlood + amount); G.damageFlash = 1; }
function updateBloodOverlay(dt) { if (G.screenBlood > 0) G.screenBlood = Math.max(0, G.screenBlood - dt * 0.00008); if (G.damageFlash > 0) G.damageFlash = Math.max(0, G.damageFlash - dt * 0.002); }
function drawBloodOverlay() { if (G.damageFlash > 0.05) { ctx.fillStyle = `rgba(180,10,10,${G.damageFlash * 0.35})`; ctx.fillRect(0, 0, W, H); } if (G.screenBlood > 0.02) { ctx.save(); ctx.globalAlpha = Math.min(0.85, G.screenBlood); const g = ctx.createRadialGradient(W * 0.9, H * 0.1, 0, W * 0.9, H * 0.1, W * 0.4); g.addColorStop(0, 'rgba(140,10,10,0.7)'); g.addColorStop(1, 'rgba(60,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); } }

function generateLevel() { G.targets = []; G.obstacles = []; G.bullets = []; G.score = 0; G.hits = 0; G.totalShots = 0; G.currentTarget = 0; G.ammo = G.maxAmmo; G.time = 0; G.zoom = 1; G.breath = 100; G.scope.elevClicks = 0; G.scope.windClicks = 0; for (let i = 0; i < 8; i++) G.obstacles.push({ x: 300 + Math.random() * (WORLD_W - 600), y: 300 + Math.random() * (WORLD_H - 700), w: 50 + Math.random() * 100, h: 40 + Math.random() * 80, type: Math.random() < 0.5 ? 'rock' : 'wall' }); for (let i = 0; i < G.totalTargets; i++) { const tx = 400 + Math.random() * (WORLD_W - 800); const ty = 200 + Math.random() * (WORLD_H - 600); const d = Math.hypot(tx - WORLD_W/2, ty - (WORLD_H - PLAYER_Y_OFFSET)) * SCALE; G.targets.push({ x: tx, y: ty, baseX: tx, baseY: ty, alive: true, distance: Math.round(d), range: 40 + Math.random() * 70, speed: 0.00025, phase: Math.random() * Math.PI * 2, state: 'walk', size: 32 }); } G.wind.speed = 1.5 + Math.random() * 7.5; G.wind.dir = Math.random() < 0.5 ? 1 : -1; initWeather(); updateHUD(); }
function screenToWorld(sx, sy) { return { x: (sx - W / 2) / G.zoom + (G.camera.x + W / 2), y: (sy - H / 2) / G.zoom + (G.camera.y + H / 2) }; }
function updateScopeReadout() { const e = G.scope.elevClicks * 0.1, w = G.scope.windClicks * 0.1; document.querySelector('.scope-readout .e').textContent = (e >= 0 ? '+' : '-') + toArabicNum(Math.abs(e).toFixed(1)); document.querySelector('.scope-readout .w').textContent = (w >= 0 ? '+' : '-') + toArabicNum(Math.abs(w).toFixed(1)); }
function setupScopeControls() { document.getElementById('elevUp').onclick = () => { G.scope.elevClicks++; updateScopeReadout(); Sound.click(); }; document.getElementById('elevDown').onclick = () => { G.scope.elevClicks--; updateScopeReadout(); Sound.click(); }; document.getElementById('elevReset').onclick = () => { G.scope.elevClicks = 0; updateScopeReadout(); Sound.click(); }; document.getElementById('windLeft').onclick = () => { G.scope.windClicks--; updateScopeReadout(); Sound.click(); }; document.getElementById('windRight').onclick = () => { G.scope.windClicks++; updateScopeReadout(); Sound.click(); }; document.getElementById('windReset').onclick = () => { G.scope.windClicks = 0; updateScopeReadout(); Sound.click(); }; }
setupScopeControls();
function updateHUD() { document.getElementById('scoreVal').textContent = toArabicNum(G.score); document.getElementById('windSpeed').textContent = toArabicNum(G.wind.speed.toFixed(1)); document.getElementById('timeLeft').textContent = toArabicNum(Math.max(0, Math.ceil((G.timeLimit - G.time) / 1000))); document.getElementById('targetNum').textContent = toArabicNum(G.currentTarget + 1) + ' / ' + toArabicNum(G.totalTargets); document.getElementById('breathBar').style.width = G.breath + '%'; const wNames = { clear: 'صافٍ', rain: 'مطر', sandstorm: 'عاصفة', storm: 'رعدية' }; document.getElementById('weatherLabel').textContent = wNames[G.weather.type]; }

function fire() { if (!G.running || G.reloading || G.ammo <= 0 || G.recoil > 0.5) return; Sound.init(); Sound.shot(); G.ammo--; G.totalShots++; G.recoil = 1; G.shake = 14; const pW = { x: WORLD_W/2, y: WORLD_H - PLAYER_Y_OFFSET }; const wA = screenToWorld(G.aim.x, G.aim.y); let ang = Math.atan2(wA.y - pW.y, wA.x - pW.x) + (G.scope.elevClicks * 0.1) / 1000; G.bullets.push({ x: pW.x, y: pW.y, vx: Math.cos(ang) * BULLET_SPEED, vy: Math.sin(ang) * BULLET_SPEED, windageAdjust: Math.sin((G.scope.windClicks * 0.1) / 1000) * BULLET_SPEED * 0.01, life: 4, trail: [], fromPlayer: true }); if (G.ammo === 0) setTimeout(() => { if (G.running) { G.reloading = true; Sound.click(); setTimeout(() => { G.ammo = G.maxAmmo; G.reloading = false; updateHUD(); }, 1200); } }, 300); updateHUD(); }
function handleTargetHit(t, b) { const dy = b.y - t.y; let part = 'torso', pts = 100; if (dy < -t.size * 0.3) { part = 'head'; pts = 300; } else if (dy > t.size * 0.3) { part = 'legs'; pts = 50; } G.hits++; G.score += pts; t.alive = false; part === 'head' ? Sound.headshot() : Sound.hit(); G.shake = 20; if (part === 'head') addScreenBlood(0.6); else addScreenBlood(0.3); setTimeout(() => { if (G.currentTarget < G.totalTargets - 1) G.currentTarget++; else endMission(true); updateHUD(); }, 600); }
function updateBullets(dt) { for (let i = G.bullets.length - 1; i >= 0; i--) { const b = G.bullets[i]; b.vy += GRAVITY * dt; const s = Math.hypot(b.vx, b.vy); b.vx -= (b.vx / s) * DRAG * s * s * dt; b.vy -= (b.vy / s) * DRAG * s * s * dt; b.vx += G.wind.speed * G.wind.dir * WIND_FORCE * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; for (const t of G.targets) { if (t.alive && Math.hypot(b.x - t.x, b.y - t.y) < t.size) { handleTargetHit(t, b); G.bullets.splice(i, 1); break; } } if (b.life <= 0) G.bullets.splice(i, 1); } }
function update(dt) { if (!G.running) return; G.time += dt; if (G.time >= G.timeLimit) return endMission(false); if (G.recoil > 0) G.recoil -= dt * 0.004; if (G.shake > 0) G.shake -= dt * 0.04; G.zoom += (G.zoomTarget - G.zoom) * Math.min(1, dt * 0.01); if (G.holdingBreath && G.breath > 0) G.breath -= dt * 0.035; else G.breath = Math.min(100, G.breath + dt * 0.025); for (const t of G.targets) { if (!t.alive) continue; t.phase += t.speed * dt; t.x = t.baseX + Math.sin(t.phase) * t.range; } updateBullets(dt); updateWeather(dt); updateBloodOverlay(dt); updateHUD(); }
function render() { ctx.fillStyle = '#0a0e14'; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.translate(W/2, H/2); ctx.scale(G.zoom, G.zoom); ctx.translate(-(G.camera.x + W/2), -(G.camera.y + H/2)); ctx.fillStyle = '#1a1410'; ctx.fillRect(0, 0, WORLD_W, WORLD_H); for (const o of G.obstacles) { ctx.fillStyle = '#3a3028'; ctx.fillRect(o.x, o.y, o.w, o.h); } for (const t of G.targets) { if (!t.alive) continue; ctx.fillStyle = '#8a6a5a'; ctx.beginPath(); ctx.arc(t.x, t.y - t.size * 0.7, t.size * 0.28, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#5a6a4a'; ctx.fillRect(t.x - t.size * 0.35, t.y - t.size * 0.4, t.size * 0.7, t.size * 0.9); } for (const b of G.bullets) { ctx.fillStyle = '#ffdd88'; ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill(); } ctx.restore(); ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(W/2, H/2, Math.min(W,H)*0.48, 0, Math.PI * 2); ctx.stroke(); ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(W/2 - 50, H/2); ctx.lineTo(W/2 + 50, H/2); ctx.moveTo(W/2, H/2 - 50); ctx.lineTo(W/2, H/2 + 50); ctx.stroke(); drawWeatherEffects(); drawBloodOverlay(); }
let lastTime = 0;
function loop(now) { if (!G.running) return; if (!lastTime) lastTime = now; const dt = Math.min(now - lastTime, 50); lastTime = now; update(dt); render(); if (G.running) requestAnimationFrame(loop); }
function startGame() { Sound.init(); generateLevel(); G.running = true; G.aim.x = W / 2; G.aim.y = H / 2; G.holdingBreath = false; G.zoom = 1; G.zoomTarget = 1; document.getElementById('zoomBtn').textContent = '1x'; document.getElementById('zoomBtn').classList.remove('active'); document.getElementById('breathBtn').classList.remove('active'); lastTime = 0; document.getElementById('startScreen').classList.add('hidden'); document.getElementById('endScreen').classList.add('hidden'); updateHUD(); updateScopeReadout(); requestAnimationFrame(loop); }
function endMission(success) { if (!G.running) return; G.running = false; const acc = G.totalShots > 0 ? Math.round((G.hits / G.totalShots) * 100) : 0; document.getElementById('endTitle').textContent = success ? 'أُنجزت المهمة' : 'انتهى الوقت'; document.getElementById('endTitle').style.color = success ? '#a8ff9a' : '#ff8a8a'; document.getElementById('endScore').textContent = toArabicNum(G.score); document.getElementById('endHits').textContent = toArabicNum(G.hits) + ' / ' + toArabicNum(G.totalTargets); document.getElementById('endAcc').textContent = toArabicNum(acc) + '%'; document.getElementById('endScreen').classList.remove('hidden'); }
document.getElementById('startBtn').onclick = startGame; document.getElementById('retryBtn').onclick = startGame;
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); Sound.init(); if (!G.running) return; const t = e.touches[0]; G.touch.active = true; G.touch.id = t.identifier; G.touch.sx = t.clientX; G.touch.sy = t.clientY; G.touch.ax = G.aim.x; G.touch.ay = G.aim.y; }, { passive: false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (!G.running || !G.touch.active) return; for (const t of e.touches) { if (t.identifier === G.touch.id) { const dx = t.clientX - G.touch.sx; const dy = t.clientY - G.touch.sy; const sens = 0.55 / G.zoom; G.aim.x = Math.max(0, Math.min(W, G.touch.ax + dx * sens)); G.aim.y = Math.max(0, Math.min(H, G.touch.ay + dy * sens)); const worldAim = screenToWorld(G.aim.x, G.aim.y); const pPos = { x: WORLD_W/2, y: WORLD_H - PLAYER_Y_OFFSET }; document.getElementById('distance').textContent = toArabicNum(Math.round(Math.hypot(worldAim.x - pPos.x, worldAim.y - pPos.y) * SCALE)); break; } } }, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); if (e.touches.length === 0) G.touch.active = false; }, { passive: false });
canvas.addEventListener('mousedown', (e) => { Sound.init(); if (!G.running) return; G.touch.active = true; G.touch.sx = e.clientX; G.touch.sy = e.clientY; G.touch.ax = G.aim.x; G.touch.ay = G.aim.y; });
window.addEventListener('mousemove', (e) => { if (!G.running || !G.touch.active) return; const dx = e.clientX - G.touch.sx; const dy = e.clientY - G.touch.sy; const sens = 0.55 / G.zoom; G.aim.x = Math.max(0, Math.min(W, G.touch.ax + dx * sens)); G.aim.y = Math.max(0, Math.min(H, G.touch.ay + dy * sens)); });
window.addEventListener('mouseup', () => { G.touch.active = false; });
document.getElementById('fireBtn').addEventListener('touchstart', (e) => { e.preventDefault(); fire(); }, { passive: false });
document.getElementById('fireBtn').addEventListener('mousedown', (e) => { e.preventDefault(); fire(); });
document.getElementById('breathBtn').addEventListener('touchstart', (e) => { e.preventDefault(); G.holdingBreath = true; document.getElementById('breathBtn').classList.add('active'); }, { passive: false });
document.getElementById('breathBtn').addEventListener('touchend', (e) => { e.preventDefault(); G.holdingBreath = false; document.getElementById('breathBtn').classList.remove('active'); }, { passive: false });
document.getElementById('breathBtn').addEventListener('mousedown', () => { G.holdingBreath = true; document.getElementById('breathBtn').classList.add('active'); });
window.addEventListener('mouseup', () => { G.holdingBreath = false; document.getElementById('breathBtn').classList.remove('active'); });
document.getElementById('zoomBtn').onclick = () => { G.zoomTarget = G.zoomTarget > 1 ? 1 : 3; document.getElementById('zoomBtn').textContent = G.zoomTarget > 1 ? '3x' : '1x'; document.getElementById('zoomBtn').classList.toggle('active', G.zoomTarget > 1); };
})();
</script>
